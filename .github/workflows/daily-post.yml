name: daily-instagram-post

on:
  schedule:
    # GitHub-Cron ist unzuverlaessig (Verzug bis Stunden, Laeufe fallen aus).
    # Darum viele Versuchsfenster; der 7-Uhr-Guard + posted.log sorgen dafuer,
    # dass trotzdem nur EIN Post pro Tag rausgeht.
    - cron: "3 5 * * *"     # 07:03 CEST
    - cron: "33 5 * * *"    # 07:33 CEST
    - cron: "3 6 * * *"     # 08:03 CEST / 07:03 CET
    - cron: "33 6 * * *"    # 08:33 CEST / 07:33 CET
    - cron: "3 7 * * *"     # 09:03 CEST / 08:03 CET
    - cron: "33 7 * * *"    # 09:33 CEST / 08:33 CET
    - cron: "3 8 * * *"     # 10:03 CEST / 09:03 CET
  push:
    paths:
      - "trigger.txt"       # Not-Hebel: Datei aendern und pushen loest sofort einen Lauf aus
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish today's post
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841445655178570"
          RAW_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main"
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python3 publish.py

      - name: Tweet today's quote (X)
        if: always()
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python3 post_tweet.py

      - name: Post reel to TikTok
        if: always()
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          RAW_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main"
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python3 post_tiktok.py

      - name: Commit logs
        if: always()
        run: |
          git config user.name "nondualnormal"
          git config user.email "nondualnormal@users.noreply.github.com"
          for f in posted.log tweeted.log tiktoked.log; do
            [ -f "$f" ] && git add "$f" || true
          done
          if ! git diff --cached --quiet; then
            git commit -m "posted $(date -u +%F)"
            git push
          fi

      - name: Refresh IG token (verlaengert 60-Tage-Gueltigkeit)
        if: always()
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RESP=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}") || true
          NEW=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('access_token',''))" 2>/dev/null || true)
          if [ -n "$NEW" ]; then
            if [ "$NEW" != "$IG_TOKEN" ]; then
              gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
              echo "Token erneuert und Secret aktualisiert."
            else
              echo "Token-Gueltigkeit verlaengert."
            fi
          else
            echo "Hinweis: Token-Refresh nicht moeglich (evtl. Token juenger als 24h). Antwort: $RESP"
          fi
