name: post-reels-once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish test reels
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841445655178570"
          RAW_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main"
        run: python3 reels_once.py
      - name: Commit
        run: |
          git config user.name nondualnormal
          git config user.email nondualnormal@users.noreply.github.com
          git add -A
          git commit -m "test reels published" && git push || echo "nichts zu committen"
