name: post-backlog-once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish backlog posts
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841445655178570"
          RAW_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main"
        run: python3 backlog.py
      - name: Commit changes
        run: |
          git config user.name "nondualnormal"
          git config user.email "nondualnormal@users.noreply.github.com"
          git add -A
          git commit -m "backlog published $(date -u +%F)" && git push || echo "nichts zu committen"
