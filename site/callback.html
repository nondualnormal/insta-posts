<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization — nondual poster</title>
<style>
  body{font-family:Georgia,serif;max-width:640px;margin:8vh auto;padding:0 24px;color:#3a3a3a;background:#faf7f2;line-height:1.7}
  h1{font-weight:normal}
  code{background:#efe9df;padding:2px 6px;border-radius:4px;word-break:break-all}
</style>
</head>
<body>
<h1>Authorization complete</h1>
<p id="msg">Reading authorization response …</p>
<p><small>You can close this window. The operator transfers the code manually into the
publishing pipeline — nothing is transmitted from this page.</small></p>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get("code"), err = p.get("error");
  var el = document.getElementById("msg");
  if (code) { el.innerHTML = "Authorization code:<br><code>" + code.replace(/</g,"&lt;") + "</code>"; }
  else if (err) { el.textContent = "Error: " + err + " — " + (p.get("error_description") || ""); }
  else { el.textContent = "No authorization parameters present."; }
</script>
</body>
</html>
